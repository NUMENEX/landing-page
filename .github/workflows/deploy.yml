name: Build and Deploy to Build Branch

on:
  push:
    branches:
      - communex

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install yarn
        run: npm install -g yarn

      - name: Install dependencies
        run: yarn

      - name: Build project
        run: yarn run build

      - name: Deploy to build branch
        run: |
          # Configure Git
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          # Save current SHA for reference
          COMMIT_SHA=$(git rev-parse --short HEAD)

          # Clone the repo into a separate dir
          git clone --branch build https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }} build-output || \
          git clone https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }} build-output

          cd build-output
          git checkout -B build

          # Clean existing contents
          rm -rf *

          # Copy new build contents
          cp -r ../dist/* ./

          # Commit and push only if there are changes
          if [[ -n "$(git status --porcelain)" ]]; then
            git add .
            git commit -m "Update build from ${COMMIT_SHA}"
            git push origin build
          else
            echo "No changes to commit"
          fi
